<!--
  БЛОК 01 — HERO  [id="hero"]
  Место: первый экран страницы
  Задача: захватить внимание, донести УТП, дать CTA
  Содержит: лейбл, h1, подзаголовок, 3 фичи (срок / цена / эксперт), 2 кнопки
  Фон: #FFFFFF снаружи + #F7F7F7 с градиентными пятнами внутри карточки
  Шрифт: Mulish подключается здесь один раз — остальные блоки не дублируют
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --mbs-green-dark:  #417033;
    --mbs-green:       #4F883E;
    --mbs-green-light: #B6D8AB;
    --mbs-bg-green:    #E7F2E3;
    --mbs-red:         #CC2841;
    --mbs-red-soft:    #D83D54;
    --mbs-bg:          #F5F5F5;
    --mbs-black:       #1F1F1F;
    --mbs-gray:        #555555;
    --mbs-white:       #FFFFFF;
  }

  .mbs-hero {
    font-family: 'Mulish', sans-serif;
    background: #FFFFFF;
    padding: 48px 20px;
    color: #1F1F1F;
  }
  .mbs-hero * { box-sizing: border-box; }

  .mbs-hero__outer {
    max-width: 1320px;
    margin: 0 auto;
  }

  /* Карточка с градиентными пятнами */
  .mbs-hero__card {
    border: 8px solid #E7F2E3;
    border-radius: 28px;
    background:
      radial-gradient(circle at 17% 12%, rgba(231,242,227,0.78) 0, rgba(231,242,227,0.78) 18%, transparent 19%),
      radial-gradient(circle at 88% 84%, rgba(231,242,227,0.66) 0, rgba(231,242,227,0.66) 16%, transparent 17%),
      radial-gradient(circle at 58% 56%, rgba(231,242,227,0.32) 0, rgba(231,242,227,0.32) 13%, transparent 14%),
      #F7F7F7;
    padding: 72px 76px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 0 56px;
    align-items: start;
  }

  /* Левая верхняя часть */
  .mbs-hero__content-top {
    grid-column: 1;
    grid-row: 1;
  }

  /* Левая нижняя часть */
  .mbs-hero__content-bottom {
    grid-column: 1;
    grid-row: 2;
    padding-top: 32px;
  }

  /* Правая — изображение/видео на всю высоту */
  .mbs-hero__media {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    align-items: center;
  }

  .mbs-hero__label {
    display: inline-flex;
    align-items: center;
    margin-bottom: 20px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(231, 242, 227, 0.95);
    color: #417033;
    font-size: 13px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.01em;
  }

  .mbs-hero__title {
    margin: 0 0 20px;
    font-size: 72px;
    font-weight: 900;
    line-height: 0.92;
    letter-spacing: -0.06em;
    color: #1F1F1F;
  }

  .mbs-hero__lead {
    margin: 0;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.02em;
    color: #1F1F1F;
    max-width: 420px;
  }

  /* Фичи: срок · цена · эксперт */
  .mbs-hero__features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .mbs-hero__feature {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .mbs-hero__feature-icon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: #E7F2E3;
    color: #417033;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .mbs-hero__feature-icon svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mbs-hero__feature-value {
    font-size: 17px;
    font-weight: 800;
    color: #1F1F1F;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .mbs-hero__feature-label {
    font-size: 12px;
    font-weight: 600;
    color: #555555;
    line-height: 1.3;
  }

  /* Кнопки */
  .mbs-hero__btns {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .mbs-hero__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: 0 32px;
    border-radius: 999px;
    background: #CC2841;
    color: #fff !important;
    text-decoration: none !important;
    font-family: 'Mulish', sans-serif;
    font-size: 16px;
    font-weight: 900;
    line-height: 1;
    transition: background 0.2s, transform 0.2s;
    white-space: nowrap;
    border: none;
    cursor: pointer;
  }
  .mbs-hero__btn:hover {
    background: #D83D54;
    transform: translateY(-1px);
    color: #fff !important;
  }

  .mbs-hero__btn-consult {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 58px;
    padding: 0 30px;
    border-radius: 999px;
    background: transparent;
    border: 2.5px solid #417033;
    color: #417033 !important;
    text-decoration: none !important;
    font-family: 'Mulish', sans-serif;
    font-size: 16px;
    font-weight: 800;
    line-height: 1;
    transition: background 0.2s, color 0.2s, transform 0.2s;
    white-space: nowrap;
    cursor: pointer;
  }
  .mbs-hero__btn-consult:hover {
    background: #417033;
    color: #FFFFFF !important;
    transform: translateY(-1px);
  }

  /* Медиа: фото бара */
  .mbs-hero__img {
    width: 100%;
    border-radius: 20px;
    object-fit: cover;
    aspect-ratio: 4 / 3;
    display: block;
    background: #dde8d8;
  }

  /* Бейдж поверх фото */
  .mbs-hero__img-wrap {
    position: relative;
    width: 100%;
  }

  .mbs-hero__badge {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(31,31,31,0.12);
  }

  .mbs-hero__badge-name {
    font-size: 13px;
    font-weight: 800;
    color: #1F1F1F;
    line-height: 1.2;
  }

  .mbs-hero__badge-role {
    font-size: 11px;
    font-weight: 600;
    color: #555555;
    line-height: 1.3;
  }

  /* ─── Адаптив ─── */

  @media (max-width: 1180px) {
    .mbs-hero__title { font-size: 56px; }
    .mbs-hero__lead  { font-size: 18px; }
    .mbs-hero__card  { gap: 0 36px; padding: 56px 48px; }
  }

  @media (max-width: 820px) {
    .mbs-hero {
      padding: 14px 12px;
    }
    .mbs-hero__card {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      padding: 28px 20px 28px;
      gap: 0;
      border-width: 4px;
    }
    .mbs-hero__content-top    { grid-column: 1; grid-row: 1; }
    .mbs-hero__media          { grid-column: 1; grid-row: 2; margin: 20px 0; }
    .mbs-hero__content-bottom { grid-column: 1; grid-row: 3; padding-top: 0; }

    .mbs-hero__title { font-size: 40px; letter-spacing: -0.05em; margin-bottom: 14px; }
    .mbs-hero__lead  { font-size: 16px; max-width: 100%; }
    .mbs-hero__label { margin-bottom: 14px; }
    .mbs-hero__features { grid-template-columns: repeat(3, 1fr); margin-top: 20px; }
    .mbs-hero__feature-icon { width: 36px; height: 36px; border-radius: 10px; }
    .mbs-hero__feature-icon svg { width: 18px; height: 18px; }
    .mbs-hero__feature-value { font-size: 14px; }
    .mbs-hero__btns { flex-direction: column; }
    .mbs-hero__btn, .mbs-hero__btn-consult { width: 100%; justify-content: center; }
  }

  @media (max-width: 420px) {
    .mbs-hero__title { font-size: 34px; }
  }
</style>

<section class="mbs-hero" id="hero">
  <div class="mbs-hero__outer">
    <div class="mbs-hero__card">

      <!-- Верхняя левая: лейбл + заголовок + подзаголовок -->
      <div class="mbs-hero__content-top">
        <span class="mbs-hero__label">Услуги для бизнеса</span>
        <h1 class="mbs-hero__title">Проектирование и эргономика бара</h1>
        <p class="mbs-hero__lead">Создадим идеальное рабочее пространство для бариста и обеспечим быстрый, удобный и качественный сервис для ваших гостей</p>
      </div>

      <!-- Правая: фото -->
      <div class="mbs-hero__media">
        <div class="mbs-hero__img-wrap">
          <!-- Замените src на реальное фото бара -->
          <img
            class="mbs-hero__img"
            src="https://static.tildacdn.com/tild3861-3163-4135-b066-633337643365/d628e548a384d46b26d0.jpg"
            alt="Проект планировки кофейного бара — Московская школа бариста"
            onerror="this.style.background='#dde8d8'; this.removeAttribute('src')"
          >
        </div>
      </div>

      <!-- Нижняя левая: фичи + кнопки -->
      <div class="mbs-hero__content-bottom">
        <div class="mbs-hero__features">

          <div class="mbs-hero__feature">
            <div class="mbs-hero__feature-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <span class="mbs-hero__feature-value">10 дней</span>
            <span class="mbs-hero__feature-label">срок&nbsp;выполнения</span>
          </div>

          <div class="mbs-hero__feature">
            <div class="mbs-hero__feature-icon">
              <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <span class="mbs-hero__feature-value">от 40&nbsp;000&nbsp;₽</span>
            <span class="mbs-hero__feature-label">стоимость проекта</span>
          </div>

          <div class="mbs-hero__feature">
            <div class="mbs-hero__feature-icon">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span class="mbs-hero__feature-value">МШБ</span>
            <span class="mbs-hero__feature-label">15 лет опыта в&nbsp;индустрии</span>
          </div>

        </div>

        <div class="mbs-hero__btns">
          <a href="#consalt" class="mbs-hero__btn">Оставить заявку</a>
          <a href="#how" class="mbs-hero__btn-consult" onclick="event.preventDefault();document.getElementById('how')&&document.getElementById('how').scrollIntoView({behavior:'smooth'})">Как проходит работа</a>
        </div>
      </div>

    </div>
  </div>
</section>
