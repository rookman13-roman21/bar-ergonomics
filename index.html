  <div id="block-01"></div>

  <div id="block-06"></div>
  <div id="block-07"></div>
  <div id="block-08"></div>

  <script>
    async function loadBlock(id, file) {
      const res = await fetch('/tilda-blocks/' + file);
      const html = await res.text();
      // Вставляем содержимое body из каждого фрагмента
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const body = doc.body;
      const target = document.getElementById(id);
      // Переносим стили из head
      doc.head.querySelectorAll('style').forEach(s => {
        const clone = document.createElement('style');
        clone.textContent = s.textContent;
        document.head.appendChild(clone);
      });
      // Переносим содержимое body
      while (body.firstChild) {
        target.appendChild(body.firstChild);
      }
      // Запускаем скрипты
      target.querySelectorAll('script').forEach(orig => {
        const s = document.createElement('script');
        s.textContent = orig.textContent;
        orig.replaceWith(s);
      });
    }

    (async () => {
      await loadBlock('block-01', '01-hero.html');
      await loadBlock('block-02', '02-advantages.html');
      await loadBlock('block-03', '03-deliverables.html');
      await loadBlock('block-04', '04-how-it-works.html');
      await loadBlock('block-05', '05-portfolio.html');
      await loadBlock('block-06', '06-price.html');
      await loadBlock('block-07', '07-faq.html');
      await loadBlock('block-08', '08-final-cta.html');
    })();
  </script>
